name: hyper_inventory
description: نظام محلي لإدارة مخزون الهايبر ماركت ودفعات الصلاحية والتقارير.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  cross_file: ^0.3.4+2
  crypto: ^3.0.3
  image_picker: ^1.0.7
  file_picker: ^8.0.7
  excel: ^4.0.6
  csv: ^5.1.1
  intl: ^0.19.0
  share_plus: ^7.2.2
  fl_chart: ^0.66.2
  google_mlkit_commons: ^0.11.0
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_barcode_scanning: ^0.14.1
  google_mlkit_image_labeling: ^0.14.1
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  sqflite_common_ffi: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/hyper_logo.png
